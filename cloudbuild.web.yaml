# Builds the web image; pass the public Firebase config and service URLs as substitutions.
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.web
      - -t
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/just-imagine/web:$_TAG'
      - --build-arg=NEXT_PUBLIC_FIREBASE_API_KEY=$_FIREBASE_API_KEY
      - --build-arg=NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=$_FIREBASE_AUTH_DOMAIN
      - --build-arg=NEXT_PUBLIC_FIREBASE_PROJECT_ID=$PROJECT_ID
      - --build-arg=NEXT_PUBLIC_FIREBASE_APP_ID=$_FIREBASE_APP_ID
      - --build-arg=NEXT_PUBLIC_API_URL=$_API_URL
      - --build-arg=NEXT_PUBLIC_GATEWAY_URL=$_GATEWAY_URL
      - .
images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/just-imagine/web:$_TAG'
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 1800s
